<form action="/login" method="POST">
    
    <input 
        type="text" 
        placeholder="Phone number, username, or email" 
        name="username" 
        required
    />
    
    <input 
        type="password" 
        placeholder="Password" 
        name="password" 
        required
    />
    
    <button type="submit">Log in</button>
    
</form>
